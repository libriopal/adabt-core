      - name: 'Extract Context & Memory Status'
        id: status
        run: |
          # 1. Determine Actor Role
          AUTHOR="${{ github.actor }}"
          if [[ "$AUTHOR" == *"viktor"* ]]; then
            echo "role=ARCHITECT" >> $GITHUB_OUTPUT
            echo "color=#36a64f" >> $GITHUB_OUTPUT
          elif [[ "$AUTHOR" == *"coderabbit"* ]]; then
            echo "role=GOVERNOR" >> $GITHUB_OUTPUT
            echo "color=#ff0000" >> $GITHUB_OUTPUT
          else
            echo "role=SOVEREIGN" >> $GITHUB_OUTPUT
            echo "color=#439FE0" >> $GITHUB_OUTPUT
          fi

          # 2. One-Line Verbose Memory Check
          FILES_CHANGED=$(git diff --name-only HEAD^ HEAD)
          if echo "$FILES_CHANGED" | grep -q "shared/project-memory.md"; then
            MEM_MSG="✅ MEMORY CONSOLIDATED: project-memory.md updated."
          elif echo "$FILES_CHANGED" | grep -q ".md"; then
            MEM_MSG="⚠️ PARTIAL UPDATE: Agent logs updated, but project-memory.md is STALE."
          else
            MEM_MSG="❌ MEMORY VOID: No ledger updates detected in this push."
          fi
          echo "mem_status=$MEM_MSG" >> $GITHUB_OUTPUT

      - name: Send Slack Notification
        uses: slackapi/slack-github-action@v1.26.0
        with:
          payload: |
            {
              "attachments": [
                {
                  "color": "${{ steps.status.outputs.color }}",
                  "blocks": [
                    {
                      "type": "header",
                      "text": { "type": "plain_text", "text": "🛡️ AMIS Alert: ${{ steps.status.outputs.role }}" }
                    },
                    {
                      "type": "section",
                      "text": {
                        "type": "mrkdwn",
                        "text": "*Memory Status:* `${{ steps.status.outputs.mem_status }}`"
                      }
                    },
                    {
                      "type": "section",
                      "text": {
                        "type": "mrkdwn",
                        "text": "*Commit:* ${{ github.event.head_commit.message || github.event.pull_request.title }}"
                      }
                    },
                    {
                      "type": "context",
                      "elements": [{ "type": "mrkdwn", "text": "Branch: *${{ github.ref_name }}* | Actor: ${{ github.actor }}" }]
                    }
                  ]
                }
              ]
            }

