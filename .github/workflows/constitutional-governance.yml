name: Constitutional Governance
on:
  pull_request:
    branches: [main, dev]

jobs:
  validate-governance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify Memory Ledger
        run: |
          if [[ -z $(git diff --name-only | grep "shared/project-memory.md") ]]; then
            echo "VETO: Memory ledger not updated." && exit 1
          fi
      - name: Constitutional Compliance Check
        uses: ./.github/actions/constitutional-check

