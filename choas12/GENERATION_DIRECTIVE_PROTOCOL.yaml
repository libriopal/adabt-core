  base_url: https://openrouter.ai/api
  separated_from_python_proxy: true
  note: Do not use the Python proxy bridge docs as Claude Code configuration.
review_handoff:
  uninformed_agent_prompt: prompts/UNINFORMED_AGENT_REVIEW_PROMPT.md
  claude_correction_prompt: prompts/CLAUDE_CORRECTION_PROMPT.md
  machine_plan_schema: schemas/phase-plan.schema.json
acceptance_gate:
  verdict_format: PASS_OR_VETO
  pass_requires:
    - all_declared_files_exist
    - all_api_requests_are_governance_wrapped
    - local_cli_has_no_mutating_side_effects
    - no_secrets_are_committed
    - railway_and_github_are_contracts_only
    - code_review_can_reconstruct_phase_context
  veto_requires:
    - blocking_issue_id
    - affected_files
    - deterministic_risk
    - repair_instruction
    - re_audit_conditions
