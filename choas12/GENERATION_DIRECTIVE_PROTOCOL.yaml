    - repo_scaffold
    - generate_plus_optimize
    - strict_pass_veto
    - github_railway_openrouter_deployment_readiness
  redirected_path:
    - openrouter_python_proxy_bridge
    - local_only_prompt_to_app_fallback
    - claude_code_openrouter_correction
