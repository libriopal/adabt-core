    - DRAFT
    - PENDING_CODERABBIT_AUDIT
    - VETO
    - REPAIR_REQUIRED
    - PASS
    - GENERATE_AUTHORIZED
  current: PENDING_CODERABBIT_AUDIT
phase_contract:
  phase_plan_required: true
  machine_readable_plan_required: true
  manifest_required: true
  checksums_required: true
  audit_record_required: true
  memory_ledger_update_required: true
  deployment_check_required: true
  veto_repair_log_required: true
forbidden_before_pass:
  - deploy_to_railway
  - push_to_protected_or_target_branch
  - mark_generated_files_accepted
  - persist_secret_values
  - bypass_api_request_governance
  - skip_uninformed_agent_review
  - skip_coderabbit_review
openrouter_bridge_contract:
  route_type: python_proxy_bridge
  auth_source: environment_only
  secret_storage: forbidden
  request_envelope_required: true
  audit_log_required: true
  model_allowlist_required: true
  dry_run_supported: true
  local_only_supported: true
  railway_ready_but_not_deployed: true
claude_code_contract:
